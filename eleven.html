<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top left, rgba(180, 83, 9, 0.22), transparent 32%),
        radial-gradient(circle at bottom right, rgba(124, 45, 18, 0.16), transparent 28%),
        linear-gradient(135deg, #f8f1e7 0%, #f0e3cf 100%);
      font-family: Georgia, "Noto Serif Malayalam", serif;
      padding: 24px;
    }

    .button {
      appearance: none;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #b45309 0%, #7c2d12 100%);
      color: #fff;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .button:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>
  <button id="pickFileButton" class="button" type="button">Upload</button>
  <input id="fileInput" type="file" accept="audio/*,video/*" />

  <script>
    const API_KEY = "sk_d13ae21fdea0b9fa4e854639f9dfe4bbdad1fbb33f5bb132";
    const ENDPOINT = "https://api.elevenlabs.io/v1/speech-to-text";
    const MODEL_ID = "scribe_v2";
    const LANGUAGE_CODE = "mal";

    const pickFileButton = document.getElementById("pickFileButton");
    const fileInput = document.getElementById("fileInput");

    function escapeHtml(text) {
      return text.replace(/[&<>]/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;"
      }[char]));
    }

    async function transcribeFile(file) {
      if (!file) {
        return;
      }

      pickFileButton.disabled = true;
      pickFileButton.textContent = "Uploading...";

      const formData = new FormData();
      formData.append("file", file);
      formData.append("model_id", MODEL_ID);
      formData.append("language_code", LANGUAGE_CODE);

      try {
        const response = await fetch(ENDPOINT, {
          method: "POST",
          headers: {
            "xi-api-key": API_KEY
          },
          body: formData
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.detail?.message || data.detail || data.message || "Transcription failed.");
        }

        const text = data.text?.trim();

        if (!text) {
          throw new Error("Transcript not found.");
        }

        document.body.innerHTML = `<pre style="margin:0;padding:24px;white-space:pre-wrap;word-break:break-word;font:18px/1.8 Georgia, 'Noto Serif Malayalam', serif;background:#fffaf2;color:#1f2937;min-height:100vh;">${escapeHtml(text)}</pre>`;
      } catch (error) {
        pickFileButton.disabled = false;
        pickFileButton.textContent = "Upload";
        alert(error.message);
      }
    }

    pickFileButton.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", (event) => {
      const file = event.target.files && event.target.files[0];
      transcribeFile(file);
    });

    window.addEventListener("load", () => {
      setTimeout(() => fileInput.click(), 250);
    });
  </script>
</body>
</html>
